<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ページが見つかりません | 株式会社トライテック</title>
<meta name="robots" content="noindex">
<meta name="description" content="お探しのページは見つかりませんでした。株式会社トライテックのサイトマップからご覧になりたいページをお探しください。">
<link rel="icon" type="image/svg+xml" href="/assets/images/logo/tritech-logo.svg">
<link rel="icon" type="image/png" href="/assets/images/logo/tritech-logo.png">
<link rel="apple-touch-icon" href="/assets/images/logo/tritech-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/common.css">
<style>
/* ── 404ページ (自己完結スタイル) ── */
.nf-hero{
  min-height:calc(100vh - 220px);
  display:flex;align-items:center;justify-content:center;
  padding:140px 5vw 80px;
  text-align:center;position:relative;overflow:hidden;
  background:var(--bg,#FBF9F4);
}
.nf-hero::before{
  content:'';position:absolute;
  top:-160px;left:50%;transform:translateX(-50%);
  width:640px;height:640px;
  background:radial-gradient(circle,rgba(217,95,30,.08) 0%,transparent 60%);
  pointer-events:none;
}
.nf-inner{position:relative;z-index:1;max-width:760px;margin:0 auto}

/* 菱形3つ (ロゴモチーフ) */
.nf-diamonds{display:flex;justify-content:center;gap:14px;margin-bottom:2rem}
.nf-diamonds span{
  width:18px;height:18px;transform:rotate(45deg);border-radius:3px;
  animation:nf-float 2.2s ease-in-out infinite;
}
.nf-diamonds span:nth-child(1){background:#D95F1E}
.nf-diamonds span:nth-child(2){background:#1E8FA0;animation-delay:.25s}
.nf-diamonds span:nth-child(3){background:#1A3A6A;animation-delay:.5s}
@keyframes nf-float{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(-10px)}}

.nf-code{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(5rem,14vw,9rem);line-height:1;
  letter-spacing:-.04em;color:var(--ink,#0F1224);
  margin-bottom:.5rem;
}
.nf-code .o{color:#D95F1E}
.nf-title{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:clamp(1.1rem,2.4vw,1.5rem);color:var(--ink,#0F1224);
  margin-bottom:1.2rem;
}
.nf-lead{
  font-size:.92rem;color:var(--muted,#6B7280);line-height:2;
  margin-bottom:2.6rem;
}
.nf-links{
  display:flex;flex-wrap:wrap;justify-content:center;gap:12px;
}
.nf-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:13px 26px;border-radius:100px;
  font-size:.88rem;font-weight:700;text-decoration:none;
  transition:transform .2s,box-shadow .2s,background .2s;
}
.nf-btn-primary{
  background:#D95F1E;color:#fff;
  box-shadow:0 6px 20px rgba(217,95,30,.3);
}
.nf-btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(217,95,30,.4)}
.nf-btn-ghost{
  border:1.5px solid rgba(15,18,36,.18);color:var(--ink,#0F1224);
  background:transparent;
}
.nf-btn-ghost:hover{transform:translateY(-2px);border-color:#1E8FA0;color:#1E8FA0}
@media(max-width:600px){
  .nf-hero{padding:120px 5vw 60px}
  .nf-links{flex-direction:column;align-items:stretch}
  .nf-btn{justify-content:center}
}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WQRCJC9H8X"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-WQRCJC9H8X');
</script>
</head>
<body>

<!-- ヘッダー（共通部品 _partials/header.html を JS で注入） -->
<div data-include="header"></div>

<section class="nf-hero">
  <div class="nf-inner">
    <div class="nf-diamonds" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="nf-code">4<span class="o">0</span>4</div>
    <h1 class="nf-title">お探しのページが見つかりません</h1>
    <p class="nf-lead">
      URLが変更されたか、ページが削除された可能性があります。<br>
      お手数ですが、以下のリンクからご覧になりたいページをお探しください。
    </p>
    <div class="nf-links">
      <a href="/" class="nf-btn nf-btn-primary">ホームへ戻る →</a>
      <a href="/service-list/" class="nf-btn nf-btn-ghost">事業内容</a>
      <a href="/recruit/" class="nf-btn nf-btn-ghost">採用情報</a>
      <a href="/contact/" class="nf-btn nf-btn-ghost">お問い合わせ</a>
    </div>
  </div>
</section>

<!-- フッター（共通部品 _partials/footer.html を JS で注入） -->
<div data-include="footer"></div>

<script src="/assets/js/include-partials.js"></script>
<script src="/assets/js/common.js" defer></script>
<script src="/assets/js/game-loader.js" defer></script>

</body>
</html>
